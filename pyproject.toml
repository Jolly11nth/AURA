[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-robotics"
version = "0.5.1"
description = "Autonomous Universal Robotic Assistant engineering and robotics framework."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jolly Christopher" }]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools]
packages = ["Core", "Parts", "Assembly", "Manufacturing", "Simulation", "Export"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# The repository intentionally uses top-level, PascalCase package names
# (Core, Parts, Assembly, etc.) as part of the frozen AURA architecture.
# Keep Ruff focused on correctness-oriented lint rules rather than forcing
# a package-layout rename or broad style migration at this stage.
select = ["E", "F", "W", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["Core", "Parts", "Assembly", "Manufacturing", "Simulation", "Export"]
