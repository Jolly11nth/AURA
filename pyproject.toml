[project]
name = "aura-robotics"
version = "0.5.0"
description = "Autonomous Universal Robotic Assistant engineering and robotics framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jolly Christopher" }]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["Core", "Parts", "Assembly", "Manufacturing", "Simulation", "Export"]
