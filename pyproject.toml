[project]
name = "aura-robotics"
version = "0.1.0"
description = "Autonomous Universal Robotic Assistant robotics framework scaffold."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jolly Christopher" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["Core", "Parts", "Assembly", "Manufacturing", "Simulation", "Export"]
